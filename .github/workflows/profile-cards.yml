# Atualiza cards/stats.svg e cards/languages.svg todo dia.
# Usa só um script local (scripts/cards.mjs), sem Actions de terceiros.
name: Cards do perfil

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar cards
        run: node scripts/cards.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commitar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/stats.svg cards/languages.svg
          git diff --cached --quiet || (git commit -m "Atualiza cards de estatísticas" && git push)
